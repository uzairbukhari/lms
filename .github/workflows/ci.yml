name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    # Deploys to Cloudflare on every push to main, once the repository secrets below are set
    # (see README.md). Without them this job is skipped.
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Apply database migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply lms-db --remote
        working-directory: worker
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: worker
