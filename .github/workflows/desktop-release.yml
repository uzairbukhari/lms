name: Desktop release

# Builds the Windows app and publishes it to R2 for over-the-air updates.
# Release: bump "version" in apps/desktop/src-tauri/tauri.conf.json and Cargo.toml, then push a tag like desktop-v1.0.1.
on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  check-rust:
    # Quick compile check on Linux for any change to the desktop shell.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libssl-dev
      - run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: windows-latest
    environment: prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: apps/desktop/src-tauri }
      - run: npm ci
      - name: Check the tag matches the app version
        shell: bash
        run: |
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          test "desktop-v$conf" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version $conf"; exit 1; }
      - name: Build the installer
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2 build
      - name: Publish to R2 and prune old releases
        shell: bash
        run: |
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          exe=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          node scripts/publish-desktop-release.mjs "$conf" "$exe" "$exe.sig" "Learning Adventures $conf"
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
